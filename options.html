<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phisherman Options</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f5f5f5; /* optional for visual contrast */
    }


    .centered-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #apiKey::placeholder {
      font-size: 14px;
      position: relative;
    }
    

    #apiKey, #saveButton {
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      margin: 10px;
      padding: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: center;
      transition: 0.4s;
      
    }
    #saveButton:hover {
      background-color: #d1e7dd;
      
    }
    #saveButton:active {
        transform: scale(0.95);
        background-color: #4CAF50;
        color: white;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        transition: all 0.1s ease;
    }
   
    #Phishing-Boat {
      width: 500px;
      height: 500px;
      position: absolute;
      bottom: 300px;
      right: 60%;
      z-index: -1;
    }
   
  
    #title {
      font-family: 'DM Serif Display', serif;
      color: #333;
      margin-bottom: 20px;
      -webkit-text-stroke: .25px #fff;
      -webkit-text-fill-color: black;
    }
    #background-waves {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 2;
    }
    #wave2 {
      fill-opacity: 0.2;
      z-index: -2;
    }
   
    
  </style>
</head>
<body>
   
  <div class="centered-container">

    <h1 id="title">Phisherman Options</h1>
    <input id="apiKey" type="text" placeholder= "Enter your Gemini API Key"/>
    <button id="saveButton">Save</button>
  </div>

  <img id="Phishing-Boat" src="Phisherman_boat.png" alt="Phishing Boat" width="150" height="150">

  <div class="background-waves" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: -1;">
    <svg viewBox="0 0 1440 320" preserveAspectRatio="none"
      style="position: absolute; bottom: 0; left: 0; width: 100%; height: 1000px; z-index: -1;">
      <path fill="#5ac8fa" fill-opacity="0."
            d="M0,160 C360,240 1080,80 1440,160 L1440,320 L0,320 Z"></path>
      <path id="wave2" fill="#00aaff" fill-opacity="0.2";
            d="M0,180 C300,100 1140,260 1440,180 L1440,320 L0,320 Z"></path>
      <path fill="#0077be" fill-opacity="0.15"
            d="M0,200 C400,300 1040,120 1440,200 L1440,320 L0,320 Z"></path>
      <path fill="#004e92" fill-opacity="0.1"
            d="M0,220 C500,180 940,280 1440,220 L1440,320 L0,320 Z"></path>
    </svg>
  </div>
 
  
  
 

  <script src="options.js"></script>
</body>
</html>
